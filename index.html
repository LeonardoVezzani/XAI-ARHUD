<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reindirizzamento al questionario…</title>
<script>
  // ================================================================
  //  INCOLLA QUI IL LINK CLOUDFLARE ATTUALE (tra le virgolette)
  // ================================================================
  var DESTINAZIONE = "https://data-wrapping-acne-kind.trycloudflare.com/";
  // ================================================================
  var SECONDI = 3;
</script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7; color: #1d1f23; padding: 24px;
  }
  .card {
    background: #fff; max-width: 440px; width: 100%; text-align: center;
    padding: 40px 32px; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 24px;
    border: 4px solid #dde1e7; border-top-color: #2563eb; border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 0 0 20px; line-height: 1.5; color: #555b66; }
  .count { font-weight: 700; color: #2563eb; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #2563eb; color: #fff; text-decoration: none; font-weight: 600;
  }
  a.btn:hover { background: #1d4ed8; }
  .small { font-size: .85rem; margin: 20px 0 0; word-break: break-all; }
  @media (prefers-color-scheme: dark) {
    body { background: #15171b; color: #e8eaed; }
    .card { background: #1f2227; box-shadow: none; }
    p { color: #a3a9b3; }
    .spinner { border-color: #343841; border-top-color: #60a5fa; }
  }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Reindirizzamento in corso…</h1>
    <p>Stai per essere portato al questionario.<br>
       Attendi <span class="count" id="count">3</span> secondi.</p>
    <a class="btn" id="link" href="#">Vai subito al questionario</a>
    <p class="small">Se non succede nulla, tocca il pulsante qui sopra.</p>
  </main>
<script>
  document.getElementById("link").href = DESTINAZIONE;
  var n = SECONDI, el = document.getElementById("count");
  el.textContent = n;
  var t = setInterval(function () {
    n--;
    el.textContent = Math.max(n, 0);
    if (n <= 0) { clearInterval(t); window.location.replace(DESTINAZIONE); }
  }, 1000);
</script>
<noscript>
  <p style="text-align:center">JavaScript è disattivato: apri il link manualmente dal pulsante.</p>
</noscript>
</body>
</html>
